<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="styles.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lexend+Deca:wght@100..900&display=swap"
    rel="stylesheet">

  <title>Frontend Mentor | Stats preview card component</title>


</head>

<body>
  <main>
    <div class="wrapper">
    <div class="text-box">
      
        <h1>Get <SPan>insights</SPan> that help your business grow.</h1>
        <p class="discription">Discover the benefits of data analytics and make better decisions regarding revenue, customer experience, and
          overall efficiency.</p>
      
      <div class="stat-box">
        <div>
          <p class="num">10k+</p>
          <p>COMPANIES</p>
        </div>

        <div>
          <p class="num">314</p>
          <p>TEMPLATES</p>
        </div>

        <div>
          <p class="num">12m+</p>
          <p>QUERIES</p>
        </div>
      </div>
    </div>

    <div class="responsive-office-image">
      <img class="mobile-image" src="images\image-header-mobile.jpg" alt="mobile view">
      <img class="desktop-image" src="images\image-header-desktop.jpg" alt="deskop view">
    </div>
  </div>
  </main>







  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Umme Ammara Sirkhot</a>.
  </footer>
</body>

</html>
